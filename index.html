    <style>
      /* Fallback immediate loading style */
      #initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        justify-content: center;
        background-color: #FFF8FB;

      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #FFDCE9;
        border-top-color: #EC3B87;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
